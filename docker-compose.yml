# Local development stack.
# Postgres runs on host port 5433 to avoid clashing with any system Postgres
# already bound to 5432.
services:
  postgres:
    image: postgres:17-alpine
    container_name: holisticai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 150205
      POSTGRES_DB: holisticai
    ports:
      - "5433:5432"
    volumes:
      - holisticai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d holisticai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  holisticai-pgdata:
