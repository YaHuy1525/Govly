# Local development stack.
# Host port 5434 — this machine already runs PostgreSQL 17 on 5432 and
# PostgreSQL 13 on 5433, so the container must avoid both.
services:
  postgres:
    image: postgres:17-alpine
    container_name: holisticai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 150205
      POSTGRES_DB: holisticai
    ports:
      - "5434:5432"
    volumes:
      - holisticai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d holisticai"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  holisticai-pgdata:
